# PROD serving-endpoint load: 10 concurrent virtual users invoking the
# ds-insights-companion-agent endpoint on the PROD workspace, bypassing React and the BFF.
# Only run after config/locust.prod-serving-smoke.conf returned 0 failures.
# Requires the same env as the smoke config, plus:
#   BIC_QUESTIONS_FILE  data/prod_questions.txt (routing examples from orchestrator.prod.yaml)
#   BIC_RESULTS_JSONL   optional per-invocation record (see scenarios/serving_endpoint_load.py)
# Each invocation uses a fresh session id; all users share one identity.
locustfile = scenarios/serving_endpoint_load.py
headless = true
users = 10
spawn-rate = 1
run-time = 10m
host = https://adidas-lh-wrk-gazelle.cloud.databricks.com
csv = results/prod-serving-load
html = results/prod-serving-load.html
