# Serving-endpoint smoke test: one direct, non-streaming chitchat invocation of the
# ds-insights-companion-agent-dev serving endpoint under the caller's own OAuth identity --
# proves the contract works before Genie/SQL or the BFF are involved, and before any stress profile.
# Requires BIC_AUTH_TOKEN (OAuth U2M for this workspace, see scripts/get-databricks-token.ps1)
# and BIC_TEST_USER_ID (the caller's Databricks user id/email).
locustfile = scenarios/serving_endpoint_smoke.py
headless = true
users = 1
spawn-rate = 1
run-time = 200s
host = https://adidas-dwhm-lh-wrk-gazelle-dev.cloud.databricks.com
csv = results/serving-smoke
html = results/serving-smoke.html
