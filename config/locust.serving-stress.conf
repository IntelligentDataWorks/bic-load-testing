# Serving-endpoint load/stress run: sustained, concurrent invocations of the
# ds-insights-companion-agent-dev endpoint, bypassing React and the FastAPI BFF.
# Only run this after config/locust.serving-smoke.conf has returned 0 failures.
# Requires BIC_AUTH_TOKEN (OAuth U2M for this workspace) and BIC_TEST_USER_ID.
# Every virtual user shares one token, so this is concurrency under a single identity.
locustfile = scenarios/serving_endpoint_load.py
headless = true
users = 5
spawn-rate = 1
run-time = 3m
host = https://adidas-dwhm-lh-wrk-gazelle-dev.cloud.databricks.com
csv = results/serving-stress
html = results/serving-stress.html
