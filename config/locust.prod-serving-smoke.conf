# PROD serving-endpoint smoke test: one direct, non-streaming invocation of the
# ds-insights-companion-agent endpoint on the PROD workspace. Gate before
# config/locust.prod-serving-load.conf.
# Requires in the same shell:
#   BIC_AUTH_TOKEN             token for adidas-lh-wrk-gazelle (prod profile in ~/.databrickscfg)
#   BIC_TEST_USER_ID           caller's Databricks user email
#   BIC_SERVING_ENDPOINT_PATH  /serving-endpoints/ds-insights-companion-agent/invocations
locustfile = scenarios/serving_endpoint_smoke.py
headless = true
users = 1
spawn-rate = 1
run-time = 200s
host = https://adidas-lh-wrk-gazelle.cloud.databricks.com
csv = results/prod-serving-smoke
html = results/prod-serving-smoke.html
