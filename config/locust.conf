# Default Locust configuration for local runs against FastAPI directly -- no auth required.
# Override any value via CLI flags or environment-specific config files.
# For the deployed, OAuth-authenticated app, use config/locust.deployed-smoke.conf
# and config/locust.deployed-stress.conf instead (see README/scripts/get-databricks-token.ps1).
locustfile = scenarios/basic_scenario.py
headless = true
users = 1
spawn-rate = 1
run-time = 10s
host = http://localhost:8000
csv = results/report
html = results/report.html
