# Local, no-auth streaming run against FastAPI directly: POST /api/chat/stream.
# Start the local BFF first. Mirrors the documented one-off command:
#   locust -f scenarios/stream_scenario.py --headless -u 1 -r 1 -t 10s --host http://localhost:8000
locustfile = scenarios/stream_scenario.py
headless = true
users = 1
spawn-rate = 1
run-time = 10s
host = http://localhost:8000
csv = results/local-stream
html = results/local-stream.html
