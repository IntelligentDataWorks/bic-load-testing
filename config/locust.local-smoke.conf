# Local health smoke gate: 1 user, /api/healthz only, against a locally running
# FastAPI BFF with no auth. Mirrors the documented one-off command:
#   locust -f scenarios/smoke_healthz.py --headless -u 1 -r 1 -t 10s --host http://localhost:8000
locustfile = scenarios/smoke_healthz.py
headless = true
users = 1
spawn-rate = 1
run-time = 10s
host = http://localhost:8000
csv = results/local-smoke
html = results/local-smoke.html
